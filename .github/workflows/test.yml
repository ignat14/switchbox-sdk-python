name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # Cross-repo shared-fixture drift guard (ADR-024 / FABLE_IMPROVEMENTS 3.1).
  # The canonical fixtures live in the (private) workspace repo, so repo CI
  # can't diff against them — but the load-bearing invariant is that the
  # *copies agree across the consuming repos* (else the two SDK suites pin
  # divergent behavior). switchbox-sdk-js is public, so its copies are
  # fetchable with no token. Expect a transient red here mid-propagation of a
  # legit fixture change: push both SDK repos, then re-run.
  fixture-drift:
    name: Fixture drift vs switchbox-sdk-js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare shared fixture copies
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/ignat14/switchbox-sdk-js/main/packages/core/tests/fixtures"
          for f in tests/fixtures/cdn-json/*.json tests/fixtures/parity/*.json; do
            rel="${f#tests/fixtures/}"
            echo "checking $rel"
            curl -fsSL "$base/$rel" -o /tmp/sibling.json \
              || { echo "::error::$rel is missing in switchbox-sdk-js — run fixtures/sync.py (workspace) and push both SDK repos"; exit 1; }
            cmp -s /tmp/sibling.json "$f" \
              || { echo "::error::$rel differs from switchbox-sdk-js's copy — shared-fixture drift (ADR-024); run fixtures/sync.py and push both SDK repos"; exit 1; }
          done
          echo "shared fixtures in sync with switchbox-sdk-js"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14 is the interpreter the package is built/shipped with (publish.yml)
        # — it must be in the matrix, not just the floor versions.
        python-version: ["3.10", "3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # The core editable install above satisfies the provider's
      # switchbox-flags requirement, so this tests provider + local core
      # together (the publish workflow tests against the *published* core).
      - name: Install OpenFeature provider
        run: pip install -e providers/openfeature

      - name: Lint
        run: ruff check .

      - name: Test with coverage
        run: pytest -v --cov=switchbox --cov-report=term-missing --cov-fail-under=80

      - name: Test OpenFeature provider
        run: pytest providers/openfeature/tests -q
